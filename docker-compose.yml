services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: live_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d live_db']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/live_db?schema=public
      JWT_VIEWER_SECRET: change-me-very-long-viewer-secret
      JWT_ADMIN_SECRET: change-me-very-long-admin-secret
      VIEWER_TOKEN_TTL: 8h
      ADMIN_TOKEN_TTL: 12h
      CORS_ORIGIN: http://localhost
      COOKIE_DOMAIN: ''
      STREAM_PUBLIC_BASE_URL: http://localhost/hls
      SESSION_STALE_SECONDS: 45
      HEARTBEAT_SECONDS: 20
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin1234
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node dist/prisma/seed.js && node dist/src/index.js"

  web:
    build:
      context: ./frontend

  rtmp-hls:
    build:
      context: ./streaming/rtmp-hls
    ports:
      - '1935:1935'

  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - web
      - rtmp-hls
    ports:
      - '80:80'
    volumes:
      - ./deploy/reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
